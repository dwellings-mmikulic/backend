# Dwellings backend reverse proxy. Installed at
# /etc/nginx/sites-available/dwellings and symlinked into sites-enabled.
#
# Canonical backend host: https://api.dwellings.tv
# Apex (dwellings.tv) and www (www.dwellings.tv) serve the static marketing
# site (a git checkout of dwellings-mmikulic/landing_page, branch
# static-landing, at /var/www/dwellings-landing; deploy = git pull): /, the
# pages /about /faq /contact /privacy /terms, and /assets/, plus /tv/ (the
# mobile page a TV's QR opens, proxied to the app). Every other path is a
# plain 404 (no redirect to the api host), and dotfiles such as .git/ are
# never served. Port 80 only upgrades to https.
# TLS certs are issued/renewed by certbot (cert name "dwellings.tv");
# the SANs must cover every server_name used in a 443 block below.

# --- Channel playlist cache ----------------------------------------------
# The linear channel playlists are a pure function of (channel, wall clock):
# every viewer of a channel gets byte-identical bytes in the same second, so
# one origin request per channel per TTL serves all of them. Without this the
# advertised Cache-Control TTLs only bind well-behaved clients and every
# player hits Go directly every couple of seconds.
#
# Bunny fronts only the segments (hls/*.ts); the playlists are served by this
# origin, so this zone is the only cache in front of them.
proxy_cache_path /var/cache/nginx/dwellings levels=1:2 keys_zone=dwellings_channels:10m
                 max_size=256m inactive=10m use_temp_path=off;

# --- Backend API (canonical) ---------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name api.dwellings.tv;
    return 301 https://api.dwellings.tv$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name api.dwellings.tv;

    ssl_certificate /etc/letsencrypt/live/dwellings.tv/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dwellings.tv/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # EPG: a 30-minute programme grid, cached longer than the playlists.
    # proxy_ignore_headers makes proxy_cache_valid authoritative over the
    # origin's own max-age=300, so a schedule change shows up within a minute.
    location = /channels/epg.json {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;

        proxy_cache dwellings_channels;
        proxy_cache_key $scheme$host$uri$is_args$args;
        proxy_ignore_headers Cache-Control Expires;
        proxy_cache_valid 200 60s;
        proxy_cache_lock on;
        proxy_cache_use_stale updating error timeout;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # resolve and beat are per viewer and never cached. Matched by regex so
    # this wins over the prefix block below. (Playlists are cached per
    # scope: audience size does not reach the app; viewers are counted by
    # the beat endpoint instead.)
    location ~ ^/channels/(resolve|beat)$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        add_header X-Cache-Status BYPASS always;
    }

    # stats: a count query, cached a minute.
    location = /channels/stats {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache dwellings_channels;
        proxy_cache_key $scheme$host$uri$is_args$args;
        proxy_ignore_headers Cache-Control Expires;
        proxy_cache_valid 200 60s;
        proxy_cache_lock on;
        proxy_cache_use_stale updating error timeout;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # Personal feeds. The media playlist names its household in the query,
    # so it caches per feed like the channel playlists. Everything else under
    # /feed/ and /tv/ depends on the connecting IP and falls through to the
    # uncached catch-all below.
    location = /feed/live.m3u8 {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;

        proxy_cache dwellings_channels;
        proxy_cache_key $scheme$host$uri$is_args$args;
        proxy_ignore_headers Cache-Control Expires;
        proxy_cache_valid 200 2s;
        proxy_cache_lock on;
        proxy_cache_use_stale updating error timeout;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # live.m3u8 / master.m3u8: 2 s, the playlist's own advertised TTL.
    location /channels/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;

        proxy_cache dwellings_channels;
        proxy_cache_key $scheme$host$uri$is_args$args;
        proxy_ignore_headers Cache-Control Expires;
        proxy_cache_valid 200 2s;
        proxy_cache_lock on;
        proxy_cache_use_stale updating error timeout;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # Roku Direct Publisher feed + health check + everything else → app container.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}

# --- Apex + www: the landing page, no redirects to the api host -----------
server {
    listen 80;
    listen [::]:80;
    server_name dwellings.tv www.dwellings.tv;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dwellings.tv www.dwellings.tv;

    ssl_certificate /etc/letsencrypt/live/dwellings.tv/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dwellings.tv/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # The web root is a git checkout: only the pages and assets below are
    # public. Nothing else in it (README, .git/) may be served.
    root /var/www/dwellings-landing;
    error_page 404 /404.html;

    # No location below sets add_header, so these apply to every response.
    # no-cache makes browsers revalidate (cheap 304s via ETag) so a git pull
    # shows at once; nothing is fingerprinted.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Dotfiles and dot-directories (.git/config, .gitignore, ...). Listed
    # first: regex locations are tried in order and beat the prefix ones.
    # 404 rather than 403 so their existence is not confirmed.
    location ~ /\. {
        return 404;
    }

    location = / {
        try_files /index.html =404;
    }

    # Clean URLs for the content pages: /about serves about.html.
    location ~ ^/(about|faq|contact|privacy|terms)$ {
        try_files /$1.html =404;
    }

    location /assets/ {
        try_files $uri =404;
    }

    # The mobile page the TV's QR opens (served by the app; the page calls
    # api.dwellings.tv itself). X-Real-IP is what identifies the household.
    location = /tv { return 301 /tv/; }
    location /tv/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              api.dwellings.tv;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /404.html {
        internal;
    }

    location / {
        return 404;
    }
}
