# Production compose — app only. Postgres runs on the separate db box
# (10.0.0.3) reached over the private network. Used on the web box at
# /opt/dwellings/compose.prod.yml.
services:
  app:
    image: ghcr.io/dwellings-mmikulic/dwellings:latest
    env_file:
      - .env
    ports:
      - "127.0.0.1:8080:8080"   # localhost only; nginx proxies public :80
    volumes:
      - /opt/dwellings/geoip:/geoip:ro   # MaxMind GeoLite2-City.mmdb (geoipupdate)
    restart: unless-stopped
    # With ROLE=all this box renders too: on SIGTERM it kills its ffmpeg
    # children and hands its claims back. The 10 s default would SIGKILL it
    # first, and the claims would sit out their leases instead.
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
